
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
    <div class="container nav">
        <h2>Expense Tracker</h2>
        <a class="button secondary"
           href="{{ url_for('index') }}">Dashboard</a>
    </div>
</header>

<main class="container form-container">
    <section class="panel">
        <h1>Add New Expense</h1>
        <p>Enter the details of your transaction below.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('add_expense') }}">
            <label for="title">Expense Title</label>
            <input type="text" id="title" name="title"
                   maxlength="100" placeholder="e.g. Lunch"
                   required>

            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" name="amount"
                   min="0.01" step="0.01"
                   placeholder="e.g. 150" required>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select a category</option>
                {% for category in categories %}
                    <option value="{{ category }}">{{ category }}</option>
                {% endfor %}
            </select>

            <label for="expense_date">Date</label>
            <input type="date" id="expense_date"
                   name="expense_date" value="{{ today }}"
                   max="{{ today }}" required>

            <label for="description">Description (optional)</label>
            <textarea id="description" name="description"
                      rows="3" maxlength="500"
                      placeholder="Add extra details"></textarea>

            <div class="form-actions">
                <button type="submit" class="button">
                    Save Expense
                </button>
                <a class="button secondary"
                   href="{{ url_for('index') }}">Cancel</a>
            </div>
        </form>
    </section>
</main>

</body>
</html>
